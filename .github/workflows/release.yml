# Publish, and then check what was published.
#
# Until this file existed, publishing was 100% manual: `npm version`, `git tag`,
# `git push`, `npm publish` at a terminal with an interactive 2FA prompt, and then
# a second terminal for `node scripts/verify-package.mjs --from-registry`. Every
# one of those steps is documented in `docs/build-and-publish.md` and
# `docs/publication_guide_ru.md`, and none of them is a step that can be run twice
# safely by accident.
#
# WHAT THIS DOES NOT REPLACE
# --------------------------
# The version bump, the CHANGELOG entry and the tag are still a maintainer's job,
# by hand. This workflow starts at the tag.
#
# RECONCILIATION NEEDED WITH THE MANUAL GUIDE
# ------------------------------------------
# `docs/publication_guide_ru.md` part 4 and `docs/build-and-publish.md` section 5
# say to run `npm publish` at a terminal, approve the 2FA prompt in a browser, and
# then run `verify-package.mjs --from-registry` by hand. Every one of those three
# steps is now either done here or is the step this workflow waits for. The
# documented procedure and this workflow must not both be followed for one
# release: a manual `npm publish` followed by this workflow's publish step fails
# with `E403 Cannot publish over the previously published version`, and the second
# failure is the confusing one because the first publish actually worked.
#
# The documentation owner should therefore reduce part 4 to "tag, push, watch
# Actions", and keep the 2FA and unpublish procedures as what they are: the
# recovery path for when this workflow fails, not part of the happy path. The
# 2FA note changes character -- it is no longer needed for a publish (trusted
# publishing with an OIDC token is), but it is still needed for `npm unpublish` and
# for `npm owner add`, and that is the distinction the guide should make.
name: Publish

on:
  push:
    tags: [ 'v*' ]
  # Manual dispatch, for the "the tag was wrong" case. The version is read from
  # the tag that is checked out, not from an input, so a manual run publishes
  # whatever the tag says rather than whatever the form said.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One publish at a time, and a run in flight is *not* cancelled: cancelling
  # halfway through `npm publish` is how you get a half-published release.
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The tag's commit, not the default branch: `v3.0.0` must publish the tree
        # that `v3.0.0` points at.
        ref: ${{ github.ref }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'
        registry-url: https://registry.npmjs.org
    - run: npm ci
    - run: npm test
    - name: Verify the packed package
      run: |
        set -o pipefail
        node scripts/verify-package.mjs 2>&1 | tee verify-package.log
    - name: Surface what failed
      if: failure()
      run: |
        grep -E '^[[:space:]]*FAIL' verify-package.log | head -20 | \
          sed 's/^[[:space:]]*/::error::/' || true

  publish:
    name: publish ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      # The only credential this job has. The CLI exchanges this identity for a
      # short-lived publish token scoped to this package, and nothing is stored.
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.x
        # No `registry-url` here, and that is load-bearing.
        #
        # `registry-url` makes setup-node write a project `.npmrc` containing
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With no token in
        # the environment that line is written with an *empty* value, npm then
        # believes it has a credential, and it never reaches for the OIDC exchange
        # that trusted publishing depends on. The symptom is exactly what this job
        # produced: E404 on PUT, which is npm's way of saying "I could not
        # authenticate" rather than "this version exists".
        #
        # Nothing in this job needs the registry configured -- there are no private
        # dependencies -- and the default registry is npmjs.org anyway.
        #
        # No cache either, per npm's guidance for a release build: a cached tree
        # from an earlier commit is how a tarball gets built from neither the
        # lockfile nor the checkout. The verify job above caches freely, because a
        # stale tree there costs a red test rather than a published release.
        #
        # Which is why the install below is a plain `npm ci` and not a cache
        # restore. It is not optional: `npm publish` runs `prepublishOnly`, which
        # is `npm test && npm run verify:package`, and both need the tree. The
        # first attempt at this published nothing and failed with
        # "command sh -c npm test && npm run verify:package" -- jest was simply
        # not on disk.
    - run: npm ci

    - name: Refuse to publish a version that already exists
      # The cheapest guard against the failure this workflow can cause. A re-run
      # of a successful tag should stop here, not at npm.
      run: |
        version=$(node -p "require('./package.json').version")
        tag="${GITHUB_REF_NAME#v}"
        if [ "$version" != "$tag" ]; then
          echo "::error::package.json says $version but the tag says $tag. Nothing was published."
          exit 1
        fi
        if npm view "anydb-mcp@$version" version >/dev/null 2>&1; then
          echo "::error::anydb-mcp@$version is already on the registry. Deprecate it or move the tag."
          exit 1
        fi

    - name: Report the OIDC identity npm will match against
      # npm matches the token's `sub` claim against the trusted publisher entry on
      # npmjs.com, and the mismatch is reported as ENEEDAUTH with no detail. The
      # claim is not a secret -- it is the workflow's identity, already public in
      # the run -- and printing it turns "the configuration is wrong somewhere"
      # into "the environment name in the config is `X` and the subject is `Y`".
      #
      # Emitted as annotations rather than stdout, because stdout is in a log
      # behind a sign-in and that is the whole reason this step exists.
      #
      # Only the decoded header and payload are read. The signature is not
      # checked and the token itself is never echoed.
      run: |
        set -euo pipefail
        url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org"
        curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" \
          | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const p=JSON.parse(Buffer.from(s.trim().split('.')[1],'base64url'));
              const line=(k,v)=>console.log('::notice title=OIDC '+k+'::'+String(v));
              line('sub', p.sub);
              line('aud', JSON.stringify(p.aud));
              line('repository', p.repository);
              line('environment_name', JSON.stringify(p.environment_name ?? null));
              line('what npm expects', 'repo:officialalexeev/anydb-mcp:environment:npm');
            });
          "

    - name: Publish with provenance
      # No NODE_AUTH_TOKEN, and that is deliberate. With trusted publishing
      # configured, the CLI detects the OIDC environment and exchanges its
      # identity for a short-lived publish token. Setting NODE_AUTH_TOKEN here
      # -- which an earlier revision of this file did, from secrets.NPM_TOKEN --
      # is the documented way to *defeat* that: npm prefers a real token, and an
      # unset secret passes an empty string. Either way the run falls back to
      # whatever is in the user config, which on a runner is nothing, and the
      # job fails with ENEEDAUTH. A token is only needed here for *installing*
      # private dependencies, and this package has none.
      #
      # `--provenance` is redundant with trusted publishing -- npm attaches an
      # attestation automatically -- but stating it is harmless and keeps the
      # intent visible if the publish path ever changes.
      #
      # Teed, and the npm errors turned into annotations, because a bare "exit
      # code 1" on this step is the single most expensive failure to diagnose in
      # the whole workflow: the cause is always in the output and the output is
      # behind a sign-in.
      run: |
        set -o pipefail
        # Belt and braces for the `.npmrc` note above: if anything in the image or
        # the repository set a token, npm would use it and skip the OIDC exchange
        # that is the whole point. An empty value is the documented way to say
        # "there is no token here".
        NODE_AUTH_TOKEN= npm publish --provenance --access public 2>&1 | tee publish.log
    - name: Surface what npm said
      # `npm error` only. The tarball listing is dozens of `npm notice` lines
      # ahead of the failure, and including them pushed the reason off the end of
      # the annotation list -- which is the reason the first two runs reported
      # nothing useful.
      if: failure()
      run: |
        {
          echo "::error title=npm publish failed::see the npm error lines below"
          grep -E '^npm error' publish.log | head -30 | sed 's/^/::error::/' || true
        }

  verify-published:
    name: verify what is on the registry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    # The tarball is not fetched by hand: `verify-package.mjs --from-registry`
    # installs the *published* artifact into a temp directory and drives it there,
    # so this job tests what npm actually serves rather than a local build of it.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.x

    # A full checkout, deliberately. `verify-package.mjs --from-registry` installs
    # the *published* tarball into a temp directory, but it also reads this
    # repository's `package.json` and `src/index.js` to assert the file list and
    # the shebang, and a sparse checkout would make those reads fail in a way that
    # looks like a packaging defect.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref }}

    - name: Wait for the registry to serve the version
      # Propagation takes a few minutes. A 404 immediately after a publish is not
      # a failure, so the check is "is it there yet", not "is it there".
      run: |
        version="${GITHUB_REF_NAME#v}"
        for attempt in $(seq 1 20); do
          if npm view "anydb-mcp@$version" version >/dev/null 2>&1; then
            echo "anydb-mcp@$version is on the registry after $((attempt * 30))s"
            exit 0
          fi
          echo "attempt $attempt: not yet published, waiting 30s"
          sleep 30
        done
        echo "::error::anydb-mcp@$version did not appear on the registry within 10 minutes."
        exit 1

    - name: Drive the published package
      run: node scripts/verify-package.mjs --from-registry --version=${{ github.ref_name }}
