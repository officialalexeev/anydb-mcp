# Static analysis, on a schedule as well as on demand.
#
# Why this repository needs it, given that it is small: `anydb-mcp` takes
# connection strings from an MCP client, interpolates nothing but still parses
# whatever a model produced, writes a log file, reads `db.json`, and runs SQL
# against five databases. `javascript-actions` in particular looks for exactly the
# two mistakes this codebase is most exposed to -- a command built by string
# concatenation (the `ANYDB_KEYCHAIN_CMD` shim, the `sqlite3` repair hint) and a
# path built from untrusted input.
#
# It is free on a public repository, needs no token, and finds nothing when the
# code is clean. Both suites run on a schedule because a finding on a push is a
# finding on a commit somebody has already merged.
#
# `security-events: write` is required to upload results. It is scoped to this
# workflow and to the `security-events` scope, and the job has no
# `contents: write`, so a finding cannot be used to change the repository.
name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # 03:17 UTC on a Monday. Off the hour on purpose: `schedule` runs on every
    # repository in GitHub at :00, and the queue at a round hour is minutes long.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      # `javascript-actions` is not analysed. CodeQL reports it as an unrecognised
      # language on this runner image, which is a property of the bundle rather
      # than of anything in this repository, and a leg that cannot initialise is
      # worse than no leg: it puts a permanent red check on every commit and
      # trains everyone to ignore the workflow. The four workflow files are 200
      # lines of YAML that hold no expressions worth evaluating; the code that can
      # actually be wrong is under `src/`, and that leg passes.
      #
      # `src/` only. The jest configuration, the babel configuration and the
      # verification script are build inputs, and CodeQL's JavaScript extractor has
      # nothing to say about them.
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # v4.38.2. The previous pin was v2.27.1, and the v2 branch's own README lists
    # only v3 as a supported major. It kept working, because a scanner that
    # silently stops reporting is indistinguishable from one that found nothing --
    # which is the one failure mode a security tool must not have. The `config`
    # block below is unchanged: `paths` and `paths-ignore` are the same in v4.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: ${{ matrix.language }}
        config: |
          paths:
            - src
          paths-ignore:
            - '**/*.test.js'
            - '__tests__'
            - coverage
            - node_modules

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        category: '/language:${{ matrix.language }}'
