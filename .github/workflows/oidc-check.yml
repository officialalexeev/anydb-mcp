# Does npm accept this workflow's identity?
#
# Trusted publishing failed four times with ENEEDAUTH while every value on the
# workflow side checked out -- the OIDC subject was exactly
# repo:officialalexeev/anydb-mcp:environment:npm, the audience was right, the
# permission was granted and no token was present. That leaves the entry on
# npmjs.com, and the only way to see why it does not match is to ask npm.
#
# This does the exchange and stops. It publishes nothing: the exchange endpoint
# hands back a token without consuming it, and there is no `npm publish` in this
# file. Manual dispatch only, so a broken configuration cannot touch a release.
name: check trusted publishing

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: exchange an OIDC token for a publish token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `environment`, so the subject below is the ref form. A successful
    # exchange here proves the credentials, the package and the audience; it
    # does not prove the environment name, which is the field most likely to be
    # the problem, and the run says so.
    steps:
    - name: Exchange the identity
      run: |
        set -uo pipefail
        say() { echo "::notice title=$1::$2"; }

        url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org"
        token="$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" \
                 | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(s.trim().split('.')[1]))" \
                 | base64 -d 2>/dev/null)" || { say "minted" "could not read the OIDC token"; exit 0; }

        say "subject"   "$(node -p "JSON.parse(process.argv[1]).sub" "$token")"
        say "audience"  "$(node -p "JSON.stringify(JSON.parse(process.argv[1]).aud)" "$token")"
        say "repository" "$(node -p "JSON.parse(process.argv[1]).repository" "$token")"

        body="$(mktemp)"
        code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(s.trim()))")" \
          -H 'Content-Type: application/json' \
          -d '{}' \
          "https://registry.npmjs.org/-/v1/oidc/token/exchange/package/anydb-mcp")

        say "exchange HTTP" "$code"
        say "exchange body" "$(head -c 400 "$body" | tr '\n' ' ')"

        if [ "$code" = "200" ]; then
          say "result" "the credentials are accepted. If a release still fails, the mismatch is the Environment name field, which this job does not exercise."
        else
          say "result" "npm rejected the identity. The Trusted Publisher entry on npmjs.com does not match this workflow."
          {
            echo "::error title=trusted publisher mismatch::"
            echo "::error::expected sub : repo:officialalexeev/anydb-mcp:environment:npm"
            echo "::error::expected aud : npm:registry.npmjs.org"
            echo "::error::check, in this order on npmjs.com/settings/anydb-mcp:"
            echo "::error::  1. Organization or user = officialalexeev"
            echo "::error::  2. Repository         = anydb-mcp"
            echo "::error::  3. Workflow filename  = release.yml  (filename only, with .yml, no path)"
            echo "::error::  4. Environment name   = npm            (the subject carries :environment:npm)"
            echo "::error::  5. Allowed actions    = npm publish    (since 2026-09-03 new entries allow stage only)"
            echo "::error::an entry cannot be edited -- delete it and create it again."
          } >> "$GITHUB_OUTPUT"
        fi
