# Does npm accept this workflow's identity?
#
# Trusted publishing failed four times with ENEEDAUTH while every value on the
# workflow side checked out -- the OIDC subject was exactly
# repo:officialalexeev/anydb-mcp:environment:npm, the audience was right, the
# permission was granted and no token was present. That leaves the entry on
# npmjs.com, and the only way to see why it does not match is to ask npm.
#
# This does the exchange and stops. It publishes nothing: the exchange endpoint
# returns a token without consuming it, and there is no `npm publish` in this
# file. Manual dispatch only, so a broken configuration cannot touch a release.
name: check trusted publishing

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: exchange an OIDC token for a publish token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same environment the release job uses, because the environment is part
    # of the subject: without it GitHub issues ...:ref:refs/heads/main, npm sees
    # an identity the Trusted Publisher entry was never registered for, and the
    # check would report a mismatch that does not exist.
    environment: npm
    steps:
    - uses: actions/checkout@v6

    - name: Ask npm whether it accepts this identity
      # Base64url, so the payload is decoded in Node. Doing it in the shell with
      # `base64 -d` silently produced nothing: the alphabet is `-_` and there is
      # no padding, and the first version of this step failed on that with a
      # cheerful "could not read the OIDC token".
      run: node scripts/oidc-check.mjs
